# Render Blueprint for the Petals Paradise backend.
# Deploy: push this repo to GitHub/GitLab, then in Render choose
# New > Blueprint and select the repo. Fill in the `sync: false` secrets when prompted.
#
# Plan names/prices change over time - check https://render.com/pricing before applying.
# NOTE: Render's free Postgres expires after 30 days; use a paid plan for real orders.

databases:
  - name: petals-db
    databaseName: petals
    plan: basic-256mb
    region: frankfurt # closest Render region to Kenya

envVarGroups:
  - name: petals-shared
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "false"
      # Social sign-in. Google Web client ID / Apple Services ID (comma separated). Blank = disabled.
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: APPLE_CLIENT_IDS
        sync: false
      # Your storefront origin(s), comma separated, e.g. https://petalsparadise.co.ke
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
services:
  - type: web
    name: petals-api
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --workers 3 --timeout 60 --access-logfile -
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: petals-db
          property: connectionString
      # For Neon, set DATABASE_URL to its pooled URL and this to its direct URL.
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # Configure SMTP for verification emails; keep these on the API, not the cron worker.
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "true"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Optional admin order-alert recipients; customer confirmations use the account email.
      - key: ORDER_ALERT_EMAILS
        sync: false
      # Neon Buckets image storage is required in production; Brevo sync is optional.
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_PUBLIC_BASE
        sync: false
      - key: STORAGE_REGION
        value: us-east-2
      # Enables catalogue sync and transactional email over HTTPS.
      - key: BREVO_API_KEY
        sync: false
      - key: SITE_URL
        sync: false
      - fromGroup: petals-shared

  # Cancels orders still awaiting payment past their deadline and releases reserved stock.
  - type: cron
    name: petals-order-sweeper
    runtime: python
    region: frankfurt
    plan: starter
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py expire_unpaid_orders
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: petals-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - fromGroup: petals-shared
